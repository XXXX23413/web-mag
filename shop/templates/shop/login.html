{% extends 'shop/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}

<div style="max-width: 450px;margin: 40px auto;background: #fff;padding: 30px;border-radius: 8px;">
    <h1 style = "margin-top: 0;">Вход</h1>

    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <div style="background: #f8d7da;color: #721c24;padding: 10px 15px;border-radius: 4px;margin-bottom: 15px;">Неверное имя пользователя или пароль</div>
        {% endif %}
        <div style = "margin-bottom: 15px;">
            <label style="display: block;margin-bottom: 5px;font-weight: bold;">Имя пользователя</label>
            {{ form.username}}
        </div>
        <div style = "margin-bottom: 15px;">
            <label style="display: block;margin-bottom: 5px;font-weight: bold;">Пароль</label>
            {{form.password}}
        </div>
        <button type ="submit" style="width: 100%;background: #2c3e50;color: white;padding: 12px;border: none;border-radius: 4px;cursor: pointer;font-size: 16px;">Войти</button>

    </form>
    <p style="text-align: center;margin-top: 20px;">
        Нет аккаунта? <a href ="{% url 'shop:register' %}" style ="color:#2c3e50">Зарегистрироваться</a>
    </p>
</div>

<style>
    input[type="text"], input[type = "password"], input[type = "email"]{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
    }
</style>

{% endblock %}
