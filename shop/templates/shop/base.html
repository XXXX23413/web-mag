<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %} Мой магазин {% endblock %} </title>
    <style>
        * {box-sizing: border-box;}
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        header{
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }
        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        main{
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        footer{
            text-align: center;
            padding: 20px;
            color: #888;
            font-size :14px;
        }
    </style>
</head>
<body>
    <header>
        <div class ="logo">
            <a href="{% url 'shop:catalog' %}">🛒 TechStore </a>
        </div>
        <nav>
            <a href = "{% url 'shop:catalog' %}">Каталог</a>
            <a href ="{% url 'shop:cart_detail'%}" id ="cart-link">Корзина {% if cart_total_items %} ({{cart_total_items}}) {%endif%}</a>
            <a href="/admin/">Админка</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        2026 TechStore - проект магазина
    </footer>
</body>    
</html>
